name: CLI release publication

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to recover, for example v0.9.0
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  # npm dist-tags do not provide compare-and-swap semantics. Serialize every
  # release so an older rerun cannot move `latest` behind a newer version.
  group: viceme-cli-release
  cancel-in-progress: false

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      recovery: ${{ steps.release.outputs.recovery }}
      release_exists: ${{ steps.release.outputs.release_exists }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Load the resolver from the trusted workflow revision on main.
          ref: ${{ github.sha }}
      - id: context
        name: Resolve merged Release PR or explicit recovery tag
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_TAG: ${{ inputs.tag || '' }}
        run: node npm/scripts/resolve-release-context.mjs
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Normal releases publish the exact reviewed dev head. Recovery
          # checks out an already-existing immutable release tag.
          ref: ${{ steps.context.outputs.release_ref }}
          fetch-depth: 0
      - id: release
        name: Resolve and validate immutable release identity
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ steps.context.outputs.release_pr_title }}
          RECOVERY: ${{ steps.context.outputs.recovery }}
          REQUESTED_TAG: ${{ steps.context.outputs.requested_tag }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          SHA="$(git rev-parse HEAD)"
          git fetch origin --tags

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json must contain a stable semantic version" >&2
            exit 1
          fi
          if [[ "${RECOVERY}" == "true" ]]; then
            if [[ "${REQUESTED_TAG}" != "${TAG}" ]]; then
              echo "recovery tag ${REQUESTED_TAG} does not match package version ${TAG}" >&2
              exit 1
            fi
          else
            if [[ "${PR_TITLE}" != "chore(release): ${TAG}" ]]; then
              echo "Release PR title must be exactly chore(release): ${TAG}" >&2
              exit 1
            fi
          fi

          EXISTING_SHA="$(git rev-list -n 1 "${TAG}" 2>/dev/null || true)"
          if [[ "${RECOVERY}" == "true" && -z "${EXISTING_SHA}" ]]; then
            echo "recovery requires an existing immutable tag ${TAG}" >&2
            exit 1
          fi
          if [[ -n "${EXISTING_SHA}" && "${EXISTING_SHA}" != "${SHA}" ]]; then
            echo "immutable tag ${TAG} already points to ${EXISTING_SHA}, not ${SHA}" >&2
            exit 1
          fi
          RELEASE_EXISTS=false
          if gh release view "${TAG}" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
            if [[ "${RECOVERY}" == "true" ]]; then
              test "$(gh release view "${TAG}" --json isDraft --jq .isDraft)" = "false"
            fi
          fi

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "sha=${SHA}"
            echo "recovery=${RECOVERY}"
            echo "release_exists=${RELEASE_EXISTS}"
          } >>"${GITHUB_OUTPUT}"

  quality:
    name: Release quality
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      commerce_skill_trust_keys: ${{ steps.commerce-trust-ring.outputs.ring }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # A normal release validates the exact reviewed release source. An
          # old immutable recovery tag may predate today's quality and trust
          # validators, so recovery validates the trusted workflow revision
          # that is actually performing the repair instead of expecting those
          # tools to exist in historical source.
          ref: ${{ needs.metadata.outputs.recovery == 'true' && github.sha || needs.metadata.outputs.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify generated release files are committed
        run: |
          make release-manifest
          git diff --exit-code
      - run: make check
      - run: make npm-package-check
      - id: commerce-trust-ring
        name: Validate and freeze Commerce Skill release trust ring
        env:
          COMMERCE_SKILL_TRUST_KEYS: ${{ vars.COMMERCE_SKILL_TRUST_KEYS }}
        run: |
          set -euo pipefail
          go run ./cmd/validate-commerce-trust-ring
          printf 'ring=%s\n' "${COMMERCE_SKILL_TRUST_KEYS}" >> "${GITHUB_OUTPUT}"

  tag:
    name: Release tag
    needs:
      - metadata
      - quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          fetch-depth: 0
      - name: Create or verify immutable release tag
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
        run: |
          git fetch origin --tags
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EXISTING_SHA="$(git rev-list -n 1 "${TAG}" 2>/dev/null || true)"
          if [[ -n "${EXISTING_SHA}" ]]; then
            test "${EXISTING_SHA}" = "${RELEASE_SHA}"
            exit 0
          fi
          git tag --annotate "${TAG}" "${RELEASE_SHA}" --message "Release ${TAG}"
          git push origin "refs/tags/${TAG}"

  binaries:
    name: Release binary (${{ matrix.goos }}/${{ matrix.goarch }})
    needs:
      - metadata
      - quality
      - tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            extension: ""
          - goos: darwin
            goarch: arm64
            extension: ""
          - goos: linux
            goarch: amd64
            extension: ""
          - goos: linux
            goarch: arm64
            extension: ""
          - goos: windows
            goarch: amd64
            extension: ".exe"
          - goos: windows
            goarch: arm64
            extension: ".exe"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Recovery planning belongs to the trusted current workflow, not to
          # an older immutable release tag.
          ref: ${{ github.sha }}
          path: .release-workflow
      - id: recovery-assets
        name: Plan immutable binary recovery
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
          RECOVERY: ${{ needs.metadata.outputs.recovery }}
          RELEASE_EXISTS: ${{ needs.metadata.outputs.release_exists }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          set -euo pipefail
          ASSET="viceme_${VERSION}_${GOOS}_${GOARCH}${EXTENSION}"
          EXISTING_ASSETS='[]'
          if [[ "${RECOVERY}" == "true" && "${RELEASE_EXISTS}" == "true" ]]; then
            EXISTING_ASSETS="$(gh release view "${TAG}" --json assets --jq '[.assets[].name]')"
          fi
          node .release-workflow/npm/scripts/plan-release-binary-recovery.mjs \
            "${ASSET}" "${EXISTING_ASSETS}" >>"${GITHUB_OUTPUT}"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.recovery-assets.outputs.needs_build == 'true'
        with:
          go-version-file: .release-workflow/go.mod
          cache: true
      - name: Revalidate frozen Commerce Skill trust ring
        if: steps.recovery-assets.outputs.needs_build == 'true'
        env:
          COMMERCE_SKILL_TRUST_KEYS: ${{ needs.quality.outputs.commerce_skill_trust_keys }}
        run: cd .release-workflow && go run ./cmd/validate-commerce-trust-ring
      - name: Recover existing immutable binary assets
        if: steps.recovery-assets.outputs.binary_exists == 'true' || steps.recovery-assets.outputs.checksum_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXTENSION: ${{ matrix.extension }}
          BINARY_EXISTS: ${{ steps.recovery-assets.outputs.binary_exists }}
          CHECKSUM_EXISTS: ${{ steps.recovery-assets.outputs.checksum_exists }}
        run: |
          set -euo pipefail
          ASSET="viceme_${VERSION}_${GOOS}_${GOARCH}${EXTENSION}"
          mkdir -p dist
          if [[ "${BINARY_EXISTS}" == "true" ]]; then
            gh release download "${TAG}" --pattern "${ASSET}" --dir dist
          fi
          if [[ "${CHECKSUM_EXISTS}" == "true" ]]; then
            gh release download "${TAG}" --pattern "${ASSET}.sha256" --dir dist
          fi
      - name: Build release binary
        if: steps.recovery-assets.outputs.needs_build == 'true'
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
          COMMERCE_SKILL_TRUST_KEYS: ${{ needs.quality.outputs.commerce_skill_trust_keys }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ASSET="viceme_${VERSION}_${GOOS}_${GOARCH}${{ matrix.extension }}"
          mkdir -p dist
          go build -trimpath -ldflags "-X github.com/ViceMe-AI/cli/internal/buildinfo.Version=${VERSION} -X github.com/ViceMe-AI/cli/internal/buildinfo.Commit=${RELEASE_SHA} -X github.com/ViceMe-AI/cli/internal/buildinfo.CommerceSkillTrustKeys=${COMMERCE_SKILL_TRUST_KEYS}" -o "dist/${ASSET}" ./cmd/viceme
      - name: Complete and verify the immutable checksum pair
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          set -euo pipefail
          ASSET="viceme_${VERSION}_${GOOS}_${GOARCH}${EXTENSION}"
          test -f "dist/${ASSET}"
          if [[ ! -f "dist/${ASSET}.sha256" ]]; then
            (cd dist && sha256sum "${ASSET}" >"${ASSET}.sha256")
          fi
          (cd dist && sha256sum -c "${ASSET}.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release-contract:
    name: Signed agent installation contract
    needs:
      - metadata
      - binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Recovery tags may predate the Agent contract generators. Execute
          # the trusted current workflow implementation against immutable
          # release inputs without modifying any existing release asset.
          ref: ${{ github.sha }}
          path: .release-workflow
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Download immutable assets from an existing Recovery release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          RECOVERY: ${{ needs.metadata.outputs.recovery }}
        run: |
          mkdir -p recovered-release
          if [[ "${RECOVERY}" == "true" ]] && gh release view "${TAG}" >/dev/null 2>&1; then
            gh release download "${TAG}" --dir recovered-release
          fi
      - name: Assemble exact-version agent installation contract
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          cp installers/install.sh dist/install.sh
          cp installers/install.ps1 dist/install.ps1
          cp release/bootstrap-contract.json dist/bootstrap-contract.json
          cp quality/release-manifest.json dist/release-manifest.json
          go run ./.release-workflow/cmd/agent-release-manifest/main.go --version "${VERSION}"
          go run ./.release-workflow/cmd/skills-archive/main.go --version "${VERSION}"
          go run ./.release-workflow/cmd/agent-install-doc/main.go --version "${VERSION}" \
            --template .release-workflow/release/agent-install.md.tmpl
          go run ./.release-workflow/cmd/agent-install-doc/main.go --version "${VERSION}" \
            --template .release-workflow/release/commerce-skill-install.md.tmpl \
            --output dist/commerce-skill-install.md
          node ./.release-workflow/npm/scripts/restore-release-assets.mjs \
            recovered-release dist
      - name: Verify recovered binary and signed Manifest consistency
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          for TARGET in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            (cd dist && sha256sum -c "viceme_${VERSION}_${TARGET}.sha256")
          done
          for TARGET in windows_amd64 windows_arm64; do
            (cd dist && sha256sum -c "viceme_${VERSION}_${TARGET}.exe.sha256")
          done
          if [[ -f recovered-release/agent-release-manifest.json ]]; then
            EXPECTED_MANIFEST="${RUNNER_TEMP}/agent-release-manifest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
            go run ./.release-workflow/cmd/agent-release-manifest/main.go \
              --version "${VERSION}" --output "${EXPECTED_MANIFEST}"
            cmp --silent "${EXPECTED_MANIFEST}" dist/agent-release-manifest.json
            rm -f "${EXPECTED_MANIFEST}"
          fi
      - name: Sign or recover the immutable release Manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          RECOVERY: ${{ needs.metadata.outputs.recovery }}
          COSIGN_YES: "true"
        run: |
          if [[ "${RECOVERY}" == "true" ]] && \
            test -f dist/agent-release-manifest.sigstore.json; then
            echo "Recovered the existing immutable Sigstore bundle"
          else
            cosign sign-blob --bundle dist/agent-release-manifest.sigstore.json dist/agent-release-manifest.json
          fi
          cosign verify-blob \
            --bundle dist/agent-release-manifest.sigstore.json \
            --certificate-identity 'https://github.com/ViceMe-AI/cli/.github/workflows/release.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            dist/agent-release-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-contract
          # The assembled candidate is authoritative for both normal release
          # and recovery. In recovery it already contains every immutable byte
          # downloaded from the existing GitHub Release, including binaries
          # and checksums that a current trust ring may no longer reproduce.
          path: dist/*
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs:
      - metadata
      - release-contract
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-contract
          path: dist
      - name: Verify complete launcher asset contract
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          for TARGET in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            test -f "dist/viceme_${VERSION}_${TARGET}"
            test -f "dist/viceme_${VERSION}_${TARGET}.sha256"
          done
          for TARGET in windows_amd64 windows_arm64; do
            test -f "dist/viceme_${VERSION}_${TARGET}.exe"
            test -f "dist/viceme_${VERSION}_${TARGET}.exe.sha256"
          done
          test -f dist/agent-install.md
          test -f dist/commerce-skill-install.md
          test -f dist/agent-release-manifest.json
          test -f dist/agent-release-manifest.sigstore.json
          test -f dist/bootstrap-contract.json
          test -f dist/install.sh
          test -f dist/install.ps1
          test -f dist/release-manifest.json
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 20
      - name: Publish or verify the immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            test "$(gh release view "${TAG}" --json isDraft --jq .isDraft)" = "false"
            mapfile -t EXISTING_ASSETS < <(gh release view "${TAG}" --json assets --jq '.assets[].name')
            asset_exists() {
              local WANTED="$1"
              local ASSET
              for ASSET in "${EXISTING_ASSETS[@]}"; do
                if [[ "${ASSET}" == "${WANTED}" ]]; then
                  return 0
                fi
              done
              return 1
            }

            for NAME in "${EXISTING_ASSETS[@]}"; do
              test -f "dist/${NAME}"
            done

            mkdir -p existing-release
            MISSING_ASSETS=()
            for FILE in dist/*; do
              # dist/skills is the hosted-skills staging tree, not a release
              # asset; gh release upload cannot take a directory.
              [[ -f "${FILE}" ]] || continue
              NAME="${FILE#dist/}"
              if asset_exists "${NAME}"; then
                gh release download "${TAG}" --pattern "${NAME}" --dir existing-release
                cmp --silent "${FILE}" "existing-release/${NAME}"
              else
                MISSING_ASSETS+=("${FILE}")
              fi
            done
            if (( ${#MISSING_ASSETS[@]} > 0 )); then
              gh release upload "${TAG}" "${MISSING_ASSETS[@]}"
            fi
          else
            # Only flat files are GitHub Release assets; dist/skills is the
            # hosted-skills staging tree published to S3 by its own jobs.
            mapfile -t RELEASE_ASSETS < <(find dist -maxdepth 1 -type f | sort)
            gh release create "${TAG}" "${RELEASE_ASSETS[@]}" --verify-tag --generate-notes --title "${TAG}"
          fi

          rm -rf verified-release
          mkdir -p verified-release
          gh release download "${TAG}" --dir verified-release
          test "$(find verified-release -maxdepth 1 -type f | wc -l)" -eq 20
          for FILE in dist/*; do
            [[ -f "${FILE}" ]] || continue
            NAME="${FILE#dist/}"
            cmp --silent "${FILE}" "verified-release/${NAME}"
          done

  npm-publish:
    name: npm publication
    needs:
      - metadata
      - github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install OIDC-capable npm CLI
        run: npm install --global npm@11.12.1
      - run: npm ci
      - name: Verify trusted publisher OIDC context
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
      - name: Bundle the immutable release checksums into npm
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          mkdir -p release-checksums
          gh release download "${TAG}" --pattern '*.sha256' --dir release-checksums

          for TARGET in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            ASSET="viceme_${VERSION}_${TARGET}"
            FILE="release-checksums/${ASSET}.sha256"
            test -f "${FILE}"
            read -r CHECKSUM NAME EXTRA <"${FILE}"
            [[ "${CHECKSUM}" =~ ^[a-f0-9]{64}$ ]]
            test "${NAME}" = "${ASSET}"
            test -z "${EXTRA:-}"
          done
          for TARGET in windows_amd64 windows_arm64; do
            ASSET="viceme_${VERSION}_${TARGET}.exe"
            FILE="release-checksums/${ASSET}.sha256"
            test -f "${FILE}"
            read -r CHECKSUM NAME EXTRA <"${FILE}"
            [[ "${CHECKSUM}" =~ ^[a-f0-9]{64}$ ]]
            test "${NAME}" = "${ASSET}"
            test -z "${EXTRA:-}"
          done
          test "$(find release-checksums -maxdepth 1 -type f | wc -l)" -eq 6
          LC_ALL=C sort -k2 release-checksums/*.sha256 >checksums.txt
          test "$(wc -l <checksums.txt)" -eq 6
      - name: Publish npm launcher or verify an exact prior publish
        run: node npm/scripts/publish-or-verify.mjs

  s3-publication:
    name: CN and Global S3 publication
    needs:
      - metadata
      - github-release
      - release-contract
    runs-on: ubuntu-latest
    environment: cdn
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-contract
          path: dist
      - name: Publish immutable release and monotonic latest pointers
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          CN_ENDPOINT: ${{ secrets.VICEME_RELEASE_S3_ENDPOINT_CN }}
          CN_BUCKET: ${{ secrets.VICEME_RELEASE_S3_BUCKET_CN }}
          CN_ACCESS_KEY_ID: ${{ secrets.VICEME_RELEASE_S3_ACCESS_KEY_ID_CN }}
          CN_SECRET_ACCESS_KEY: ${{ secrets.VICEME_RELEASE_S3_SECRET_ACCESS_KEY_CN }}
          CN_S3_HTTPS_PROXY: ${{ secrets.CN_S3_HTTPS_PROXY }}
          GLOBAL_ENDPOINT: ${{ secrets.VICEME_RELEASE_S3_ENDPOINT_GLOBAL }}
          GLOBAL_BUCKET: ${{ secrets.VICEME_RELEASE_S3_BUCKET_GLOBAL }}
          GLOBAL_ACCESS_KEY_ID: ${{ secrets.VICEME_RELEASE_S3_ACCESS_KEY_ID_GLOBAL }}
          GLOBAL_SECRET_ACCESS_KEY: ${{ secrets.VICEME_RELEASE_S3_SECRET_ACCESS_KEY_GLOBAL }}
          # GitHub runner images track the latest AWS CLI, which enables
          # optional streaming checksums by default. Our S3-compatible origins
          # do not accept that trailer protocol, so retain SigV4 integrity but
          # calculate request/response checksums only when the API requires it.
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
        run: |
          set -euo pipefail
          publish_region() {
            local ENDPOINT="$1" BUCKET="$2" ACCESS_KEY="$3" SECRET_KEY="$4" LABEL="$5" PUBLIC_ORIGIN="$6"
            test -n "${ENDPOINT}" && test -n "${BUCKET}" && test -n "${ACCESS_KEY}" && test -n "${SECRET_KEY}"
            export AWS_ACCESS_KEY_ID="${ACCESS_KEY}"
            export AWS_SECRET_ACCESS_KEY="${SECRET_KEY}"
            export AWS_DEFAULT_REGION="us-east-1"
            local PREFIX="cli/releases"
            local SCRATCH
            SCRATCH="$(mktemp -d)"
            trap 'rm -rf "${SCRATCH}"' RETURN

            put_immutable() {
              local SOURCE="$1" KEY="$2" CONTENT_TYPE="${3:-}"
              local CONTENT_TYPE_ARGS=()
              if [[ -n "${CONTENT_TYPE}" ]]; then
                CONTENT_TYPE_ARGS=(--content-type "${CONTENT_TYPE}")
              fi
              if aws --endpoint-url "${ENDPOINT}" s3api head-object --bucket "${BUCKET}" --key "${KEY}" >/dev/null 2>&1; then
                aws --endpoint-url "${ENDPOINT}" s3 cp "s3://${BUCKET}/${KEY}" "${SCRATCH}/existing" --only-show-errors
                cmp --silent "${SOURCE}" "${SCRATCH}/existing"
              else
                aws --endpoint-url "${ENDPOINT}" s3 cp "${SOURCE}" "s3://${BUCKET}/${KEY}" \
                  --cache-control 'public,max-age=31536000,immutable' "${CONTENT_TYPE_ARGS[@]}" --only-show-errors
              fi
            }

            for FILE in dist/*; do
              # dist/skills is published as its own tree below; directories are
              # never objects of the flat contract loop.
              [[ -f "${FILE}" ]] || continue
              if [[ "${FILE}" == *.md ]]; then
                put_immutable "${FILE}" "${PREFIX}/v${VERSION}/${FILE#dist/}" 'text/markdown; charset=utf-8'
              else
                put_immutable "${FILE}" "${PREFIX}/v${VERSION}/${FILE#dist/}"
              fi
            done

            # Hosted official Skills: deterministic zips, the machine-readable
            # hosting manifest, and a flat per-file tree for direct single-file
            # URLs (skills/<skill>/SKILL.md, scripts/...). Flat files are raw
            # source bytes, so byte-immutability holds by construction.
            # 按扩展映射托管物的 Content-Type;未知扩展留空,由对象存储
            # 按默认 application/octet-stream 处理——对未来的二进制资源
            # (图片等)是安全默认,不会把二进制标成文本。
            hosted_content_type() {
              case "${1}" in
                *.zip) echo 'application/zip' ;;
                *.json) echo 'application/json; charset=utf-8' ;;
                *.md|*.markdown) echo 'text/markdown; charset=utf-8' ;;
                *.txt) echo 'text/plain; charset=utf-8' ;;
                *.py) echo 'text/x-python; charset=utf-8' ;;
                *.sh) echo 'text/x-shellscript; charset=utf-8' ;;
                *.yaml|*.yml) echo 'text/yaml; charset=utf-8' ;;
                *.toml) echo 'application/toml; charset=utf-8' ;;
                *.html|*.htm) echo 'text/html; charset=utf-8' ;;
                *.js|*.mjs) echo 'text/javascript; charset=utf-8' ;;
                *.css) echo 'text/css; charset=utf-8' ;;
                *.svg) echo 'image/svg+xml' ;;
                *) echo '' ;;
              esac
            }
            while IFS= read -r FILE; do
              put_immutable "${FILE}" "${PREFIX}/v${VERSION}/skills/${FILE#dist/skills/}" "$(hosted_content_type "${FILE}")"
            done < <(find dist/skills -type f | sort)

            local EXISTING_LATEST=""
            if aws --endpoint-url "${ENDPOINT}" s3 cp "s3://${BUCKET}/${PREFIX}/latest" "${SCRATCH}/latest" --only-show-errors 2>/dev/null; then
              EXISTING_LATEST="$(tr -d '\r\n' <"${SCRATCH}/latest")"
            fi
            local HIGHEST
            HIGHEST="$(printf '%s\n%s\n' "${EXISTING_LATEST:-0.0.0}" "${VERSION}" | sort -V | tail -n 1)"
            if [[ "${HIGHEST}" == "${VERSION}" ]]; then
              printf '%s\n' "${VERSION}" >"${SCRATCH}/new-latest"
              aws --endpoint-url "${ENDPOINT}" s3 cp "${SCRATCH}/new-latest" "s3://${BUCKET}/${PREFIX}/latest" \
                --content-type text/plain --cache-control 'public,max-age=60' --only-show-errors
              for FILE in install.sh install.ps1 bootstrap-contract.json release-manifest.json agent-release-manifest.json agent-release-manifest.sigstore.json agent-install.md commerce-skill-install.md; do
                if [[ "${FILE}" == *.md ]]; then
                  aws --endpoint-url "${ENDPOINT}" s3 cp "dist/${FILE}" "s3://${BUCKET}/${PREFIX}/${FILE}" \
                    --content-type 'text/markdown; charset=utf-8' --cache-control 'public,max-age=300' --only-show-errors
                else
                  aws --endpoint-url "${ENDPOINT}" s3 cp "dist/${FILE}" "s3://${BUCKET}/${PREFIX}/${FILE}" \
                    --cache-control 'public,max-age=300' --only-show-errors
                fi
              done
              # These files stay at the public start bucket root while the scripts
              # resolve immutable artifacts below cli/releases/v{version}.
              for FILE in install.sh install.ps1 agent-install.md commerce-skill-install.md; do
                if [[ "${FILE}" == *.md ]]; then
                  aws --endpoint-url "${ENDPOINT}" s3 cp "dist/${FILE}" "s3://${BUCKET}/${FILE}" \
                    --content-type 'text/markdown; charset=utf-8' --cache-control 'public,max-age=300' --only-show-errors
                else
                  aws --endpoint-url "${ENDPOINT}" s3 cp "dist/${FILE}" "s3://${BUCKET}/${FILE}" \
                    --cache-control 'public,max-age=300' --only-show-errors
                fi
              done
              # Hosted official Skills live in their own public bucket so the
              # stable URL is https://s3.viceme.<cn|ai>/skills/<file> with no
              # path prefix; versioned copies stay under the start bucket's
              # immutable cli/releases tree. Same RustFS credentials cover it.
              # The whole tree ships: zips, manifest and the flat per-file
              # copies for direct single-file access.
              while IFS= read -r FILE; do
                local HOSTED_TYPE
                HOSTED_TYPE="$(hosted_content_type "${FILE}")"
                local HOSTED_TYPE_ARGS=()
                if [[ -n "${HOSTED_TYPE}" ]]; then
                  HOSTED_TYPE_ARGS=(--content-type "${HOSTED_TYPE}")
                fi
                aws --endpoint-url "${ENDPOINT}" s3 cp "${FILE}" "s3://skills/${FILE#dist/skills/}" \
                  "${HOSTED_TYPE_ARGS[@]}" --cache-control 'public,max-age=300' --only-show-errors
              done < <(find dist/skills -type f | sort)
            fi

            aws --endpoint-url "${ENDPOINT}" s3 cp "dist/agent-install.md" "s3://${BUCKET}/policy-probe/${GITHUB_RUN_ID}" \
              --cache-control 'private,no-store' --only-show-errors
            local PROBE_STATUS
            PROBE_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "${PUBLIC_ORIGIN}/policy-probe/${GITHUB_RUN_ID}" || true)"
            aws --endpoint-url "${ENDPOINT}" s3 rm "s3://${BUCKET}/policy-probe/${GITHUB_RUN_ID}" --only-show-errors
            test "${PROBE_STATUS}" != "200"
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' "${PUBLIC_ORIGIN}/?list-type=2")" != "200"

            curl --fail --silent --show-error "${PUBLIC_ORIGIN}/cli/releases/v${VERSION}/agent-install.md" \
              --output "${SCRATCH}/agent-install.md"
            cmp --silent dist/agent-install.md "${SCRATCH}/agent-install.md"
            if [[ "${HIGHEST}" == "${VERSION}" ]]; then
              local SKILLS_ORIGIN="${PUBLIC_ORIGIN%/start}"
              curl --fail --silent --show-error "${SKILLS_ORIGIN}/skills/manifest.json" \
                --output "${SCRATCH}/hosted-manifest.json"
              cmp --silent dist/skills/manifest.json "${SCRATCH}/hosted-manifest.json"
            fi
            curl --fail --silent --show-error "${PUBLIC_ORIGIN}/cli/releases/v${VERSION}/commerce-skill-install.md" \
              --output "${SCRATCH}/commerce-skill-install.md"
            cmp --silent dist/commerce-skill-install.md "${SCRATCH}/commerce-skill-install.md"
            curl --fail --silent --show-error "${PUBLIC_ORIGIN}/cli/releases/v${VERSION}/agent-release-manifest.json" \
              --output "${SCRATCH}/agent-release-manifest.json"
            cmp --silent dist/agent-release-manifest.json "${SCRATCH}/agent-release-manifest.json"
            curl --fail --silent --show-error "${PUBLIC_ORIGIN}/cli/releases/v${VERSION}/agent-release-manifest.sigstore.json" \
              --output "${SCRATCH}/agent-release-manifest.sigstore.json"
            cmp --silent dist/agent-release-manifest.sigstore.json "${SCRATCH}/agent-release-manifest.sigstore.json"
            curl --fail --silent --show-error --head "${PUBLIC_ORIGIN}/cli/releases/v${VERSION}/agent-install.md" \
              | grep -i '^cache-control:.*max-age=31536000.*immutable'
            curl --fail --silent --show-error --head "${PUBLIC_ORIGIN}/cli/releases/v${VERSION}/commerce-skill-install.md" \
              | grep -i '^cache-control:.*max-age=31536000.*immutable'
            if [[ "${HIGHEST}" == "${VERSION}" ]]; then
              curl --fail --silent --show-error "${PUBLIC_ORIGIN}/agent-install.md" --output "${SCRATCH}/root-agent-install.md"
              cmp --silent dist/agent-install.md "${SCRATCH}/root-agent-install.md"
              curl --fail --silent --show-error "${PUBLIC_ORIGIN}/commerce-skill-install.md" --output "${SCRATCH}/root-commerce-skill-install.md"
              cmp --silent dist/commerce-skill-install.md "${SCRATCH}/root-commerce-skill-install.md"
              curl --fail --silent --show-error --head "${PUBLIC_ORIGIN}/agent-install.md" \
                | grep -i '^cache-control:.*max-age=300'
              curl --fail --silent --show-error --head "${PUBLIC_ORIGIN}/agent-install.md" \
                | grep -i '^content-type:[[:space:]]*text/markdown;[[:space:]]*charset=utf-8'
              curl --fail --silent --show-error --head "${PUBLIC_ORIGIN}/commerce-skill-install.md" \
                | grep -i '^cache-control:.*max-age=300'
              curl --fail --silent --show-error --head "${PUBLIC_ORIGIN}/commerce-skill-install.md" \
                | grep -i '^content-type:[[:space:]]*text/markdown;[[:space:]]*charset=utf-8'
            fi
            echo "Published ${LABEL} release v${VERSION}"
          }

          test -n "${CN_S3_HTTPS_PROXY}"
          HTTPS_PROXY="${CN_S3_HTTPS_PROXY}" https_proxy="${CN_S3_HTTPS_PROXY}" \
            publish_region "${CN_ENDPOINT}" "${CN_BUCKET}" "${CN_ACCESS_KEY_ID}" "${CN_SECRET_ACCESS_KEY}" CN 'https://s3.viceme.cn/start'
          publish_region "${GLOBAL_ENDPOINT}" "${GLOBAL_BUCKET}" "${GLOBAL_ACCESS_KEY_ID}" "${GLOBAL_SECRET_ACCESS_KEY}" GLOBAL 'https://s3.viceme.ai/start'

          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "${VERIFY_DIR}"' EXIT
          HTTPS_PROXY="${CN_S3_HTTPS_PROXY}" https_proxy="${CN_S3_HTTPS_PROXY}" \
            curl --fail --silent --show-error 'https://s3.viceme.cn/start/agent-install.md' --output "${VERIFY_DIR}/cn-agent-install.md"
          curl --fail --silent --show-error 'https://s3.viceme.ai/start/agent-install.md' --output "${VERIFY_DIR}/global-agent-install.md"
          cmp --silent "${VERIFY_DIR}/cn-agent-install.md" "${VERIFY_DIR}/global-agent-install.md"
          HTTPS_PROXY="${CN_S3_HTTPS_PROXY}" https_proxy="${CN_S3_HTTPS_PROXY}" \
            curl --fail --silent --show-error 'https://s3.viceme.cn/start/commerce-skill-install.md' --output "${VERIFY_DIR}/cn-commerce-skill-install.md"
          curl --fail --silent --show-error 'https://s3.viceme.ai/start/commerce-skill-install.md' --output "${VERIFY_DIR}/global-commerce-skill-install.md"
          cmp --silent "${VERIFY_DIR}/cn-commerce-skill-install.md" "${VERIFY_DIR}/global-commerce-skill-install.md"

  notify:
    name: Feishu release notification
    needs:
      - metadata
      - npm-publish
      - s3-publication
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          fetch-depth: 0
      - name: Resolve release range
        id: range
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          git fetch origin --tags --force
          PREV_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null || true)"
          if [[ -z "${PREV_TAG}" ]]; then
            COMMITS="$(git log --oneline --no-merges -50 "${TAG}")"
            COMPARE_URL="${{ github.server_url }}/${{ github.repository }}/commits/${TAG}"
          else
            COMMITS="$(git log --oneline --no-merges "${PREV_TAG}..${TAG}")"
            COMPARE_URL="${{ github.server_url }}/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          fi
          COMMIT_COUNT="$(printf '%s\n' "${COMMITS}" | grep -c '.' || true)"
          DELIMITER="COMMITS_$(openssl rand -hex 16)"
          {
            echo "prev_tag=${PREV_TAG}"
            echo "commit_count=${COMMIT_COUNT}"
            echo "compare_url=${COMPARE_URL}"
            echo "commits<<${DELIMITER}"
            echo "${COMMITS}"
            echo "${DELIMITER}"
          } >>"${GITHUB_OUTPUT}"
      - uses: Dogtiti/feishu-bot-webhook-action@fd68eb3a1e032761a500da0ec8ea82489a8b4d9c # main
        with:
          webhook: ${{ secrets.FEISHU_RELEASE_WEBHOOK }}
          mode: release-changelog
          ai_api_key: ${{ secrets.AI_API_KEY }}
          ai_model: ${{ secrets.AI_MODEL || 'deepseek-chat' }}
          ai_base_url: ${{ secrets.AI_BASE_URL || 'https://api.deepseek.com/v1' }}
          service_name: viceme-cli
          tag_name: ${{ needs.metadata.outputs.tag }}
          commits: ${{ steps.range.outputs.commits }}
          commit_count: ${{ steps.range.outputs.commit_count }}
          compare_url: ${{ steps.range.outputs.compare_url }}
