name: CLI release preparation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: viceme-cli-release-pr-${{ github.head_ref || 'dev' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Release candidate preparation
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.base_ref == 'main' &&
       !startsWith(github.head_ref, 'hotfix/') &&
       !startsWith(github.head_ref, 'chore(repo)/integrate-') &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_BRANCH: ${{ github.head_ref || 'dev' }}
    steps:
      - id: release-app-token
        name: Create repository-scoped Release App token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - id: release-app-user
        name: Resolve Release App bot identity
        env:
          APP_SLUG: ${{ steps.release-app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >>"${GITHUB_OUTPUT}"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ steps.release-app-token.outputs.token }}
          ref: ${{ github.event.pull_request.head.sha || 'dev' }}
          fetch-depth: 0
      - name: Validate accepted release source
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          bash scripts/ci/validate-pr-target.sh
          git fetch origin +refs/heads/main:refs/remotes/origin/main --tags
          if [[ "$SOURCE_BRANCH" != dev ]]; then
            git merge-base --is-ancestor origin/main HEAD || {
              echo "Sync latest main into the feature branch and accept it in dev before release" >&2
              exit 1
            }
          fi
      - id: release-head
        name: Detect an already prepared Release Bot head
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
        run: |
          PR_HEAD_SUBJECT="$(git log -1 --format=%s)"
          PR_HEAD_BODY="$(git log -1 --format=%B)"
          PR_HEAD_AUTHOR_EMAIL="$(git log -1 --format=%ae)"
          export PR_HEAD_SUBJECT PR_HEAD_BODY PR_HEAD_AUTHOR_EMAIL
          echo "prepared=$(bash scripts/ci/validate-pr-target.sh --is-prepared-release-commit)" >>"${GITHUB_OUTPUT}"
      - name: Fetch stable branch and release tags
        if: steps.release-head.outputs.prepared != 'true'
        run: git fetch origin main --tags
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.release-head.outputs.prepared != 'true'
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.release-head.outputs.prepared != 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.release-head.outputs.prepared != 'true'
        run: npm ci
      - name: Validate GitHub Actions workflows
        if: steps.release-head.outputs.prepared != 'true'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Compute version, CHANGELOG, and generated release contracts
        if: steps.release-head.outputs.prepared != 'true'
        run: |
          RELEASE_DATE="$(date -u +%F)"
          echo "RELEASE_DATE=${RELEASE_DATE}" >>"${GITHUB_ENV}"
          export RELEASE_DATE
          make release-prepare
      - name: Verify prepared release
        if: steps.release-head.outputs.prepared != 'true'
        run: |
          make check
          make npm-package-check
          git diff --check
      - id: release
        name: Commit prepared release to original source branch
        if: steps.release-head.outputs.prepared != 'true'
        env:
          APP_SLUG: ${{ steps.release-app-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.release-app-user.outputs.user-id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          RELEASE_TRAILERS="$(printf 'ViceMe-Release-Prepared: true\nViceMe-Release-Run: %s\nViceMe-Release-Date: %s' "${RUN_URL}" "${RELEASE_DATE}")"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add \
            CHANGELOG.md \
            package.json \
            package-lock.json \
            internal/buildinfo/buildinfo.go \
            skills/*/skill-package.json \
            quality/release-manifest.json
          if ! git diff --quiet; then
            echo "Release preparation left generated files unstaged:" >&2
            git diff --name-only >&2
            exit 1
          fi
          git commit \
            --allow-empty \
            --message "chore(release): ${TAG}" \
            --message "${RELEASE_TRAILERS}"
          git push origin "HEAD:refs/heads/${SOURCE_BRANCH}"
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "sha=$(git rev-parse HEAD)"
            echo "pushed=true"
            echo "run_url=${RUN_URL}"
          } >>"${GITHUB_OUTPUT}"
      - id: prepared-release
        name: Verify prepared release metadata
        if: steps.release-head.outputs.prepared == 'true'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          SUBJECT="$(git log -1 --format=%s)"
          RUN_URL="$(git log -1 --format=%B | git interpret-trailers --parse | sed -n 's/^ViceMe-Release-Run: //p')"
          if [[ "${SUBJECT}" != "chore(release): ${TAG}" ]]; then
            echo "Prepared release subject ${SUBJECT} does not match package version ${TAG}" >&2
            exit 1
          fi
          if [[ ! "${RUN_URL}" =~ ^https://github\.com/${GITHUB_REPOSITORY}/actions/runs/[0-9]+$ ]]; then
            echo "Prepared release commit has an invalid ViceMe-Release-Run trailer" >&2
            exit 1
          fi
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "sha=$(git rev-parse HEAD)"
            echo "pushed=false"
            echo "run_url=${RUN_URL}"
          } >>"${GITHUB_OUTPUT}"
      - name: Create or update source to main Release PR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag || steps.prepared-release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha || steps.prepared-release.outputs.sha }}
          RUN_URL: ${{ steps.release.outputs.run_url || steps.prepared-release.outputs.run_url }}
        run: |
          BODY_FILE="${RUNNER_TEMP}/release-pr.md"
          {
            echo "## 自动发布 ${TAG}"
            echo
            echo "将已评审的 CLI 来源分支 \`${SOURCE_BRANCH}\` 发布到 \`main\`。"
            echo
            echo "自动更新版本号、CHANGELOG、官方 Skill 元数据与发布清单。"
            echo "已通过 \`make check\` 与 \`make npm-package-check\`。"
            echo "准备提交：\`${RELEASE_SHA}\`"
            echo "工作流证据：${RUN_URL}"
            echo
            echo "合并后自动打标签、构建六平台产物、发布 npm 与双区域镜像，并发送飞书总结。"
          } >"${BODY_FILE}"

          PR_URL="$(gh pr list --state open --base main --head "${SOURCE_BRANCH}" --json url --jq '.[0].url // empty')"
          if [[ -z "${PR_URL}" ]]; then
            gh pr create --base main --head "${SOURCE_BRANCH}" --title "chore(release): ${TAG}" --body-file "${BODY_FILE}"
          else
            # Preserve feature PR authorship and human acceptance evidence.
            CURRENT_TITLE="$(gh pr view "$PR_URL" --json title --jq .title)"
            if [[ "$SOURCE_BRANCH" == dev ]]; then
              if [[ "$CURRENT_TITLE" != "chore(release): ${TAG}" ]]; then
                gh pr edit "$PR_URL" --title "chore(release): ${TAG}" --body-file "$BODY_FILE"
              fi
            elif [[ "$CURRENT_TITLE" != "chore(release): ${TAG}" ]]; then
              gh pr edit "$PR_URL" --title "chore(release): ${TAG}"
            fi
          fi
