name: Creator template catalog

on:
  pull_request:
    paths:
      - 'templates/creator-pages/**'
      - 'skills/customize-your-page/templates/bonjour-card/**'
      - 'internal/templatecatalog/**'
      - 'cmd/template-catalog/**'
      - '.github/workflows/template-catalog.yml'
  push:
    branches: [dev, main]
    paths:
      - 'templates/creator-pages/**'
      - 'skills/customize-your-page/templates/bonjour-card/**'
      - 'internal/templatecatalog/**'
      - 'cmd/template-catalog/**'
      - '.github/workflows/template-catalog.yml'

permissions:
  contents: read

concurrency:
  group: creator-template-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./internal/templatecatalog ./cmd/template-catalog ./internal/command -run 'Template|DetachedDocument' -count=1

  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: cdn
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build signed catalog
        env:
          VICEME_TEMPLATE_CATALOG_SIGNING_KEY: ${{ secrets.VICEME_TEMPLATE_CATALOG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "${VICEME_TEMPLATE_CATALOG_SIGNING_KEY}"
          umask 077
          printf '%s' "${VICEME_TEMPLATE_CATALOG_SIGNING_KEY}" > "${RUNNER_TEMP}/template-catalog-key"
          # The first URL path component is the dedicated S3 bucket name.
          # dev publishes below that bucket's dev/ prefix; main publishes at its root.
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then CATALOG_ORIGIN='https://s3.viceme.cn/templates'; else CATALOG_ORIGIN='https://s3.viceme.cn/templates/dev'; fi
          go run ./cmd/template-catalog --source templates/creator-pages/production.json --root . \
            --output dist/template-catalog --origin "${CATALOG_ORIGIN}" --signing-key-file "${RUNNER_TEMP}/template-catalog-key"
          rm -f "${RUNNER_TEMP}/template-catalog-key"
      - name: Publish CN and Global catalogs
        env:
          CN_ENDPOINT: ${{ secrets.VICEME_RELEASE_S3_ENDPOINT_CN }}
          CN_ACCESS_KEY_ID: ${{ secrets.VICEME_RELEASE_S3_ACCESS_KEY_ID_CN }}
          CN_SECRET_ACCESS_KEY: ${{ secrets.VICEME_RELEASE_S3_SECRET_ACCESS_KEY_CN }}
          CN_S3_HTTPS_PROXY: ${{ secrets.CN_S3_HTTPS_PROXY }}
          GLOBAL_ENDPOINT: ${{ secrets.VICEME_RELEASE_S3_ENDPOINT_GLOBAL }}
          GLOBAL_ACCESS_KEY_ID: ${{ secrets.VICEME_RELEASE_S3_ACCESS_KEY_ID_GLOBAL }}
          GLOBAL_SECRET_ACCESS_KEY: ${{ secrets.VICEME_RELEASE_S3_SECRET_ACCESS_KEY_GLOBAL }}
          TEMPLATE_CATALOG_TRUST_KEYS: ${{ vars.TEMPLATE_CATALOG_TRUST_KEYS }}
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
        run: |
          set -euo pipefail
          CATALOG_BUCKET='templates'
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            KEY_PREFIX=''
            CATALOG_PATH='templates'
          else
            KEY_PREFIX='dev/'
            CATALOG_PATH='templates/dev'
          fi
          publish_region() {
            local ENDPOINT="$1" ACCESS_KEY="$2" SECRET_KEY="$3" PUBLIC_ORIGIN="$4" SOURCE_DIR="$5"
            test -n "${ENDPOINT}" && test -n "${ACCESS_KEY}" && test -n "${SECRET_KEY}"
            export AWS_ACCESS_KEY_ID="${ACCESS_KEY}" AWS_SECRET_ACCESS_KEY="${SECRET_KEY}" AWS_DEFAULT_REGION=us-east-1
            if ! aws --endpoint-url "${ENDPOINT}" s3api head-bucket --bucket "${CATALOG_BUCKET}" >/dev/null 2>&1; then
              aws --endpoint-url "${ENDPOINT}" s3api create-bucket --bucket "${CATALOG_BUCKET}" >/dev/null
            fi
            # This dedicated bucket contains only public template artifacts.
            # Grant GetObject but never ListBucket; no private object class
            # shares this whole-bucket policy.
            local BUCKET_CONTENTS UNEXPECTED_COUNT
            BUCKET_CONTENTS="$(aws --endpoint-url "${ENDPOINT}" s3api list-objects-v2 --bucket "${CATALOG_BUCKET}" --output json)"
            UNEXPECTED_COUNT="$(jq '[.Contents[]?.Key | select((startswith("dev/") or startswith("releases/") or . == "index.html" or . == "manifest.json" or . == "manifest.sig") | not)] | length' <<<"${BUCKET_CONTENTS}")"
            test "${UNEXPECTED_COUNT}" = '0'
            local POLICY
            POLICY='{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::templates/*"]}]}'
            aws --endpoint-url "${ENDPOINT}" s3api put-bucket-policy --bucket "${CATALOG_BUCKET}" --policy "${POLICY}" >/dev/null
            local SCRATCH
            SCRATCH="$(mktemp -d)"
            trap 'rm -rf "${SCRATCH}"' RETURN
            while IFS= read -r FILE; do
              KEY="${KEY_PREFIX}${FILE#"${SOURCE_DIR}"/}"
              if aws --endpoint-url "${ENDPOINT}" s3api head-object --bucket "${CATALOG_BUCKET}" --key "${KEY}" >/dev/null 2>&1; then
                aws --endpoint-url "${ENDPOINT}" s3 cp "s3://${CATALOG_BUCKET}/${KEY}" "${SCRATCH}/existing" --only-show-errors
                cmp --silent "${FILE}" "${SCRATCH}/existing"
              else
                aws --endpoint-url "${ENDPOINT}" s3 cp "${FILE}" "s3://${CATALOG_BUCKET}/${KEY}" --cache-control 'public,max-age=31536000,immutable' --only-show-errors
              fi
            done < <(find "${SOURCE_DIR}/releases" -type f | sort)
            for FILE in index.html manifest.json manifest.sig; do
              aws --endpoint-url "${ENDPOINT}" s3 cp "${SOURCE_DIR}/${FILE}" "s3://${CATALOG_BUCKET}/${KEY_PREFIX}${FILE}" --cache-control 'public,max-age=300' --only-show-errors
            done
            while IFS= read -r FILE; do
              RELATIVE="${FILE#"${SOURCE_DIR}"/}"
              mkdir -p "${SCRATCH}/public/$(dirname "${RELATIVE}")"
              curl --fail --silent --show-error "${PUBLIC_ORIGIN}/${KEY_PREFIX}${RELATIVE}" --output "${SCRATCH}/public/${RELATIVE}"
              cmp --silent "${SCRATCH}/public/${RELATIVE}" "${FILE}"
            done < <(find "${SOURCE_DIR}" -type f | sort)
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' "${PUBLIC_ORIGIN}/?list-type=2")" != '200'
          }
          HTTPS_PROXY="${CN_S3_HTTPS_PROXY}" https_proxy="${CN_S3_HTTPS_PROXY}" publish_region "${CN_ENDPOINT}" "${CN_ACCESS_KEY_ID}" "${CN_SECRET_ACCESS_KEY}" 'https://s3.viceme.cn/templates' dist/template-catalog
          publish_region "${GLOBAL_ENDPOINT}" "${GLOBAL_ACCESS_KEY_ID}" "${GLOBAL_SECRET_ACCESS_KEY}" 'https://s3.viceme.ai/templates' dist/template-catalog

          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "${VERIFY_DIR}"' EXIT
          while IFS= read -r FILE; do
            RELATIVE="${FILE#dist/template-catalog/}"
            mkdir -p "${VERIFY_DIR}/cn/$(dirname "${RELATIVE}")" "${VERIFY_DIR}/global/$(dirname "${RELATIVE}")"
            curl --fail --silent --show-error "https://s3.viceme.cn/${CATALOG_PATH}/${RELATIVE}" --output "${VERIFY_DIR}/cn/${RELATIVE}"
            curl --fail --silent --show-error "https://s3.viceme.ai/${CATALOG_PATH}/${RELATIVE}" --output "${VERIFY_DIR}/global/${RELATIVE}"
            cmp --silent "${VERIFY_DIR}/cn/${RELATIVE}" "${VERIFY_DIR}/global/${RELATIVE}"
            sha256sum "${VERIFY_DIR}/cn/${RELATIVE}" "${VERIFY_DIR}/global/${RELATIVE}"
          done < <(find dist/template-catalog -type f | sort)

          test -n "${TEMPLATE_CATALOG_TRUST_KEYS}"
          make build VERSION=dev TEMPLATE_CATALOG_TRUST_KEYS="${TEMPLATE_CATALOG_TRUST_KEYS}"
          for ORIGIN in "https://s3.viceme.cn/${CATALOG_PATH}" "https://s3.viceme.ai/${CATALOG_PATH}"; do
            VICEME_TEMPLATE_CATALOG_ORIGIN="${ORIGIN}" ./bin/viceme template list
            DESTINATION="$(mktemp -d)"
            VICEME_TEMPLATE_CATALOG_ORIGIN="${ORIGIN}" ./bin/viceme template fetch bonjour-card --version 1.0.0 --destination "${DESTINATION}"
            test -f "${DESTINATION}/bonjour-card/public/viceme-page.json"
            rm -rf "${DESTINATION}"
          done
