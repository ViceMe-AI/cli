<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>创作者作品</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f6f7f9;
        color: #1d2129;
      }

      main {
        width: min(720px, calc(100% - 32px));
        padding: 48px;
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 20px 60px rgb(29 33 41 / 12%);
      }

      h1 {
        margin: 0;
      }

      p {
        margin: 16px 0 0;
        line-height: 1.7;
        color: #5f6670;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>创作者作品</h1>
      <p>这是一个独立部署的单 HTML 创作者页面。</p>
      <div id="viceme-tip"></div>
    </main>

    <!-- 启用 Tip 前先检查精确 CDN 发布物；用户确认 SANDBOX 前保留公开测试 key。
         不要设置 no-referrer，也不要通过 query 伪造 sourceOrigin。 -->
    <script type="module">
      import { createViceMe } from "https://s3.viceme.cn/viceme-sdk/0.4.0/index.js";
      import { mountTip } from "https://s3.viceme.cn/viceme-sdk/0.4.0/tip.js";

      const target = document.querySelector("#viceme-tip");
      if (!target) throw new Error("ViceMe Tip target is missing");

      const client = createViceMe({
        workKey: "wrk_test_REPLACE_WITH_PUBLIC_IDENTIFIER",
        region: "cn",
      });
      await client.ready();
      const mountHandle = await mountTip(client, {
        target,
        theme: "auto",
      });

      function destroyViceMeTip() {
        mountHandle.destroy();
        client.destroy();
      }

      // This static document has no in-page unmount. If adapted to an SPA,
      // call destroyViceMeTip() from the real component or route cleanup.
    </script>
  </body>
</html>
