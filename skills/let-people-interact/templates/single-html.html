<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>创作者作品赞赏</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f6f7f9;
        color: #1d2129;
      }

      main {
        width: min(720px, calc(100% - 32px));
        padding: 48px;
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 20px 60px rgb(29 33 41 / 12%);
      }

      h1 {
        margin: 0;
      }

      p {
        margin: 16px 0 0;
        line-height: 1.7;
        color: #5f6670;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>支持这个作品</h1>
      <p>这是仅赞赏分支的官方 Mounted UI 单 HTML 起点。</p>
      <div id="viceme-tip"></div>
      <p id="viceme-tip-status" role="status" hidden></p>
    </main>

    <!-- 仅在统一流程已确认 CN Profile、选定公开 PUBLISHED Work，并完成
         当前区域统一发布物预检后使用。写入前替换全部
         REPLACE_WITH_RESOLVED_SDK_VERSION；仍有占位符就停止。宿主页不因此成为 Website Work。
         保留浏览器 Referer；不要设置 no-referrer，也不要伪造 sourceOrigin。
         theme 可取 "auto"、"light" 或 "dark"。 -->
    <script type="module">
      import { createViceMe } from "https://s3.viceme.cn/viceme-sdk/REPLACE_WITH_RESOLVED_SDK_VERSION/index.js";
      import { mountTip } from "https://s3.viceme.cn/viceme-sdk/REPLACE_WITH_RESOLVED_SDK_VERSION/tip.js";

      const target = document.querySelector("#viceme-tip");
      const status = document.querySelector("#viceme-tip-status");
      if (!target || !status) throw new Error("ViceMe Tip target is missing");

      const client = createViceMe({
        workKey: "wrk_test_REPLACE_WITH_PUBLIC_TEST_KEY",
        region: "cn",
      });
      let tipHandle;
      try {
        await client.ready();
        tipHandle = await mountTip(client, {
          target,
          theme: "auto",
        });
      } catch {
        status.hidden = false;
        status.textContent = "赞赏暂时不可用，请稍后重试。";
      }

      function destroyViceMeTip() {
        tipHandle?.destroy();
        client.destroy();
      }

      // 静态文档没有页面内卸载。改成 SPA 后，只在组件或路由真实卸载时
      // 调用 destroyViceMeTip()；不要绑定会在 bfcache 时触发的 pagehide。
    </script>
  </body>
</html>
