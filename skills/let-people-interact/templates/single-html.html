<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>创作者作品</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f6f7f9;
        color: #1d2129;
      }

      main {
        width: min(720px, calc(100% - 32px));
        padding: 48px;
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 20px 60px rgb(29 33 41 / 12%);
      }

      h1 {
        margin: 0;
      }

      p {
        margin: 16px 0 0;
        line-height: 1.7;
        color: #5f6670;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>创作者作品</h1>
      <p>这是一个独立部署的单 HTML 创作者页面。</p>
      <div id="viceme-interaction"></div>
    </main>

    <!-- 只使用当前 CLI 上下文、已发布 Website Work 与 SDK access 返回的精确 workKey 替换全部占位符；不得手工推导地址或区域。 -->
    <script
      defer
      src="REPLACE_WITH_SDK_SCRIPT_URL"
      data-viceme-work="REPLACE_WITH_WORK_KEY"
      data-viceme-region="REPLACE_WITH_MARKET_REGION"
      data-viceme-features="danmaku,tip"
      data-viceme-target="#viceme-interaction"
      data-viceme-theme="auto"
    ></script>
  </body>
</html>
